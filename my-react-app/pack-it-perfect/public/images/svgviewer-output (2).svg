<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <!-- Background (transparent) -->
  <rect width="500" height="200" fill="#ffffff" fill-opacity="0"/>
  
  <!-- Subtle Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="500" height="200" fill="url(#bgGradient)" rx="20" ry="20"/>
  
  <!-- Modern Box Icon -->
  <g transform="translate(70, 60) scale(0.4)">
    <path d="M50 0 L100 25 L100 75 L50 100 L0 75 L0 25 Z" fill="#1a54b2" stroke="#0e3176" stroke-width="2"/>
    <path d="M50 0 L100 25 L50 50 L0 25 Z" fill="#3f87ff" stroke="#1a54b2" stroke-width="2"/>
    <path d="M50 50 L50 100 L0 75 L0 25 Z" fill="#0e3176" stroke="#1a54b2" stroke-width="2" fill-opacity="0.7"/>
  </g>
  
  <!-- Main Text with Modern Style -->
  <text x="250" y="90" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="54" text-anchor="middle">
    <tspan fill="#1a54b2">PACK</tspan><tspan fill="#3f87ff">IT</tspan>
  </text>
  
  <text x="250" y="145" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="54" text-anchor="middle" fill="#0e3176">PERFECT</text>
  
  <!-- Stylish Underline -->
  <path d="M120,155 Q250,175 380,155" stroke="#3f87ff" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  <!-- Accent Elements -->
  <circle cx="410" cy="90" r="8" fill="#3f87ff"/>
  <circle cx="425" cy="110" r="4" fill="#3f87ff" opacity="0.7"/>
  <circle cx="415" cy="130" r="6" fill="#3f87ff" opacity="0.5"/>
</svg>